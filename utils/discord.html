<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Discord Webhook Sender</title>

		<style>
			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				background: #111827;
				color: #f9fafb;
				font-family: Arial, Helvetica, sans-serif;
			}

			.container {
				width: 100%;
				max-width: 680px;
				background: #1f2937;
				border: 1px solid #374151;
				border-radius: 16px;
				padding: 28px;
				box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
			}

			h1 {
				margin: 0 0 8px;
				font-size: 25px;
			}

			.description {
				margin: 0 0 24px;
				color: #9ca3af;
			}

			textarea {
				width: 100%;
				min-height: 150px;
				resize: vertical;
				padding: 14px;
				border-radius: 10px;
				border: 1px solid #4b5563;
				background: #111827;
				color: #fff;
				font: inherit;
				outline: none;
			}

			textarea:focus {
				border-color: #6366f1;
			}

			.drop-zone {
				margin-top: 16px;
				padding: 32px 20px;
				text-align: center;
				border: 2px dashed #4b5563;
				border-radius: 12px;
				background: #172033;
				cursor: pointer;
				transition: 0.2s;
			}

			.drop-zone:hover,
			.drop-zone.dragover {
				border-color: #6366f1;
				background: #202b45;
			}

			.drop-zone strong {
				display: block;
				margin-bottom: 8px;
			}

			.drop-zone span {
				color: #9ca3af;
				font-size: 14px;
			}

			#fileInput {
				display: none;
			}

			.file-list {
				margin-top: 14px;
			}

			.file-item {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				padding: 10px 12px;
				margin-top: 8px;
				background: #111827;
				border: 1px solid #374151;
				border-radius: 8px;
			}

			.file-name {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.file-size {
				color: #9ca3af;
				font-size: 13px;
				white-space: nowrap;
			}

			.remove-file {
				border: 0;
				background: transparent;
				color: #f87171;
				cursor: pointer;
				font-size: 18px;
			}

			button {
				width: 100%;
				margin-top: 20px;
				padding: 13px 18px;
				border: 0;
				border-radius: 9px;
				background: #5865f2;
				color: white;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
				transition: 0.2s;
			}

			button:hover {
				background: #4752c4;
			}

			button:disabled {
				opacity: 0.55;
				cursor: not-allowed;
			}

			.status {
				display: none;
				margin-top: 18px;
				padding: 12px 14px;
				border-radius: 9px;
				font-size: 14px;
			}

			.status.info {
				display: block;
				background: #172554;
				color: #bfdbfe;
			}

			.status.success {
				display: block;
				background: #052e16;
				color: #86efac;
			}

			.status.error {
				display: block;
				background: #450a0a;
				color: #fca5a5;
			}
		</style>
	</head>

	<body>
		<div class="container">
			<h1>Send a Message</h1>
			<p class="description">
				Enter the webhook password, then enter a message or attach files. The
				webhook URL is decrypted locally in your browser.
			</p>

			<input
				id="password"
				type="password"
				placeholder="Webhook password"
				autocomplete="current-password"
				style="
					width: 100%;
					padding: 14px;
					margin-bottom: 12px;
					border-radius: 10px;
					border: 1px solid #4b5563;
					background: #111827;
					color: #fff;
					font: inherit;
					outline: none;
				"
			/>

			<textarea
				id="message"
				maxlength="2000"
				placeholder="Write your message here..."
			></textarea>

			<div id="dropZone" class="drop-zone">
				<strong>Drag & drop files here</strong>
				<span>or click to choose files</span>
			</div>

			<input id="fileInput" type="file" multiple />

			<div id="fileList" class="file-list"></div>

			<button id="sendButton">Send</button>

			<div id="status" class="status"></div>
		</div>

		<script>
			/*
			 * ============================================================
			 * ENCRYPTED DISCORD WEBHOOK
			 * ============================================================
			 *
			 * The webhook URL is stored as AES-GCM ciphertext.
			 * The password is NOT stored in this file.
			 *
			 * Replace the three values below with values generated for
			 * your own webhook URL and password.
			 */
			/*
			 * Paste the single encrypted value generated by your encryption tool here.
			 *
			 * Expected format:
			 *   BASE64(salt[16 bytes] + iv[12 bytes] + ciphertext)
			 */

			function base64ToBytes(value) {
				const binary = atob(value);
				return Uint8Array.from(binary, (char) => char.charCodeAt(0));
			}

			const ENCRYPTED_WEBHOOK =
				"MUfY/GbwNQylWrf3Etx2wwuNftriBbls8TOcXzCaunbBeN7L+w2aRMMvYbrcP9UzJ+CHD+THAx8svYEOemZ1T8txXi1Ex/LBuriILNkI0aiWiADA3Q0kMcq86rvgzGEXlKppyO8xsWrjVrsM4ScFAqaZo6qS4gJUW+WclSDNGC+naBPzsnCm3M+T8HYWkJKqB0v/EYTVD0vdh/N/KJXi0z9x6kxj";

			function base64ToBytes(value) {
				const binary = atob(value);
				return Uint8Array.from(binary, (char) => char.charCodeAt(0));
			}

			async function getWebhookUrl(password) {
				if (!ENCRYPTED_WEBHOOK || ENCRYPTED_WEBHOOK.startsWith("PASTE_")) {
					throw new Error("Encrypted webhook configuration has not been set.");
				}

				if (!password) {
					throw new Error("Please enter the password.");
				}

				try {
					const packed = base64ToBytes(ENCRYPTED_WEBHOOK);

					/*
					 * Format:
					 *
					 *   16 bytes = salt
					 *   12 bytes = AES-GCM IV
					 *   remaining = ciphertext + authentication tag
					 */

					if (packed.length < 16 + 12 + 16) {
						throw new Error("Encrypted value is invalid.");
					}

					const salt = packed.slice(0, 16);
					const iv = packed.slice(16, 28);
					const ciphertext = packed.slice(28);

					const encoder = new TextEncoder();

					const passwordKey = await crypto.subtle.importKey(
						"raw",
						encoder.encode(password),
						"PBKDF2",
						false,
						["deriveKey"],
					);

					const key = await crypto.subtle.deriveKey(
						{
							name: "PBKDF2",
							salt: salt,
							iterations: 600000,
							hash: "SHA-256",
						},
						passwordKey,
						{
							name: "AES-GCM",
							length: 256,
						},
						false,
						["decrypt"],
					);

					const plaintext = await crypto.subtle.decrypt(
						{
							name: "AES-GCM",
							iv: iv,
						},
						key,
						ciphertext,
					);

					const webhookUrl = new TextDecoder().decode(plaintext);

					if (!webhookUrl.startsWith("https://discord.com/api/webhooks/")) {
						throw new Error("Decrypted value is not a Discord webhook URL.");
					}

					return webhookUrl;
				} catch (error) {
					console.error("Webhook decryption error:", error);

					throw new Error(
						"Invalid password or encrypted webhook configuration.",
					);
				}
			}

			// ------------------------------------------------------------
			// DOM elements
			// ------------------------------------------------------------

			const passwordInput = document.getElementById("password");
			const messageInput = document.getElementById("message");
			const dropZone = document.getElementById("dropZone");
			const fileInput = document.getElementById("fileInput");
			const fileList = document.getElementById("fileList");
			const sendButton = document.getElementById("sendButton");
			const statusBox = document.getElementById("status");

			let selectedFiles = [];

			// ------------------------------------------------------------
			// File handling
			// ------------------------------------------------------------

			function addFiles(files) {
				for (const file of files) {
					// Avoid duplicate files.
					const duplicate = selectedFiles.some(
						(existing) =>
							existing.name === file.name &&
							existing.size === file.size &&
							existing.lastModified === file.lastModified,
					);

					if (!duplicate) {
						selectedFiles.push(file);
					}
				}

				renderFiles();
			}

			function removeFile(index) {
				selectedFiles.splice(index, 1);
				renderFiles();
			}

			function formatFileSize(bytes) {
				if (bytes < 1024) {
					return `${bytes} B`;
				}

				if (bytes < 1024 * 1024) {
					return `${(bytes / 1024).toFixed(1)} KB`;
				}

				if (bytes < 1024 * 1024 * 1024) {
					return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
				}

				return `${(bytes / 1024 / 1024 / 1024).toFixed(1)} GB`;
			}

			function renderFiles() {
				fileList.innerHTML = "";

				selectedFiles.forEach((file, index) => {
					const item = document.createElement("div");
					item.className = "file-item";

					item.innerHTML = `
			             <span class="file-name">${escapeHtml(file.name)}</span>
			             <span class="file-size">${formatFileSize(file.size)}</span>
			             <button
			                 class="remove-file"
			                 type="button"
			                 title="Remove file"
			                 style="width:auto;margin:0;padding:0"
			                 data-index="${index}"
			             >×</button>
			         `;

					fileList.appendChild(item);
				});

				document.querySelectorAll(".remove-file").forEach((button) => {
					button.addEventListener("click", () => {
						removeFile(Number(button.dataset.index));
					});
				});
			}

			function escapeHtml(value) {
				const div = document.createElement("div");
				div.textContent = value;
				return div.innerHTML;
			}

			// ------------------------------------------------------------
			// Drag & drop
			// ------------------------------------------------------------

			dropZone.addEventListener("click", () => {
				fileInput.click();
			});

			fileInput.addEventListener("change", (event) => {
				addFiles(event.target.files);

				// Allows selecting the same file again later.
				fileInput.value = "";
			});

			dropZone.addEventListener("dragover", (event) => {
				event.preventDefault();
				dropZone.classList.add("dragover");
			});

			dropZone.addEventListener("dragleave", () => {
				dropZone.classList.remove("dragover");
			});

			dropZone.addEventListener("drop", (event) => {
				event.preventDefault();
				dropZone.classList.remove("dragover");

				if (event.dataTransfer.files.length) {
					addFiles(event.dataTransfer.files);
				}
			});

			// ------------------------------------------------------------
			// Status
			// ------------------------------------------------------------

			function setStatus(message, type) {
				statusBox.textContent = message;
				statusBox.className = `status ${type}`;
			}

			// ------------------------------------------------------------
			// Send to Discord
			// ------------------------------------------------------------

			async function sendToDiscord() {
				const message = messageInput.value.trim();

				if (!message && selectedFiles.length === 0) {
					setStatus(
						"Please enter a message or select at least one file.",
						"error",
					);
					return;
				}

				sendButton.disabled = true;
				setStatus("Sending...", "info");

				try {
					const webhookUrl = await getWebhookUrl(passwordInput.value);

					/*
					 * Discord webhooks accept multipart/form-data when files
					 * are included.
					 */
					const formData = new FormData();

					if (message) {
						formData.append(
							"payload_json",
							JSON.stringify({
								content: message,
							}),
						);
					} else {
						formData.append(
							"payload_json",
							JSON.stringify({
								content: "",
							}),
						);
					}

					selectedFiles.forEach((file, index) => {
						formData.append(`files[${index}]`, file, file.name);
					});

					const response = await fetch(webhookUrl, {
						method: "POST",
						body: formData,
					});

					if (!response.ok) {
						let details = "";

						try {
							details = await response.text();
						} catch (_) {
							// Ignore response parsing errors.
						}

						throw new Error(
							`Discord returned HTTP ${response.status}` +
								(details ? `: ${details}` : ""),
						);
					}

					setStatus("Message sent successfully.", "success");

					messageInput.value = "";
					selectedFiles = [];
					renderFiles();
				} catch (error) {
					console.error(error);

					setStatus(`Failed to send: ${error.message}`, "error");
				} finally {
					sendButton.disabled = false;
				}
			}

			sendButton.addEventListener("click", sendToDiscord);
		</script>
	</body>
</html>
